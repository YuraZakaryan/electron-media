<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>core harness</title>
  <!-- hls.js is a peerDependency; dist/index.js imports the bare specifier
       "hls.js", which only a bundler or an import map can resolve for a
       plain <script type="module"> page. -->
  <script type="importmap">
    { "imports": { "hls.js": "/vendor/hls.mjs" } }
  </script>
</head>
<body>
  <video id="video" muted playsinline width="320" height="180"></video>
  <div>ready: <span id="ready-state">false</span></div>
  <div>error: <span id="error-message"></span></div>
  <div>selected audio track id: <span id="selected-audio-track-id"></span></div>
  <ul id="audio-track-list"></ul>
  <div>selected subtitle track id: <span id="selected-subtitle-track-id"></span></div>
  <div id="subtitle-cue-text"></div>
  <div>voice-over track: <span id="selected-voiceover-track-id"></span></div>
  <div>voice-over generating: <span id="voiceover-is-generating">false</span></div>
  <div>voice-over video volume: <span id="voiceover-video-volume"></span></div>
  <div id="voiceover-event-log"></div>

  <script type="module">
    import {
      MediaPlayer,
      HlsJsAdapter,
      HlsNativeSubtitleSource,
      VodExtractedSubtitleSource,
      asSubtitleSourceId,
      asSubtitleTrackId,
      TrackKind,
    } from "/core/index.js";

    const selectedVoiceOverTrackId = document.getElementById("selected-voiceover-track-id");
    const voiceOverIsGenerating = document.getElementById("voiceover-is-generating");
    const voiceOverVideoVolume = document.getElementById("voiceover-video-volume");
    const voiceOverEventLog = document.getElementById("voiceover-event-log");

    function logVoiceOverEvent(entry) {
      window.__voiceOverLineEvents.push({ ...entry, at: Date.now() });
      voiceOverEventLog.textContent = window.__voiceOverLineEvents.map((e) => e.type).join(",");
    }

    // Synthesizes a short silent WAV clip via the Web Audio API, sized to the
    // requested cue duration — real Audio-element creation/playback/`ended`
    // events without needing sherpa-onnx or Electron in CI.
    async function synthesizeSilentWav(durationSeconds) {
      const sampleRate = 8000;
      const frameCount = Math.max(1, Math.round(durationSeconds * sampleRate));
      const ctx = new OfflineAudioContext(1, frameCount, sampleRate);
      const buffer = ctx.createBuffer(1, frameCount, sampleRate);
      const bytesPerSample = 2;
      const blockAlign = bytesPerSample;
      const byteRate = sampleRate * blockAlign;
      const dataSize = frameCount * blockAlign;
      const view = new DataView(new ArrayBuffer(44 + dataSize));
      const writeString = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };
      writeString(0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      writeString(8, "WAVE");
      writeString(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeString(36, "data");
      view.setUint32(40, dataSize, true);
      // Buffer is already zeroed (silence) by createBuffer(); no per-sample writes needed.
      void buffer;
      return URL.createObjectURL(new Blob([view.buffer], { type: "audio/wav" }));
    }

    // Test double for IVoiceOverGateway: mirrors packages/core's own
    // MockVoiceOverGateway, but produces real (silent) playable audio and a
    // window-exposed failure toggle for exercising the bad path end-to-end.
    class FakeVoiceOverGateway {
      isAvailable = true;
      #voices = [
        { languageCode: "en", displayName: "English" },
        { languageCode: "es", displayName: "Spanish" },
      ];

      async listVoices() {
        return this.#voices;
      }

      async generateLine(request) {
        if (window.__voiceOverShouldFail) {
          return { success: false, error: "forced e2e failure" };
        }
        // Forces a line whose synthesized duration exceeds its cue's own
        // window, to exercise Extended Audio Description (WCAG 1.2.7)
        // end-to-end without needing a real TTS engine that naturally runs
        // long.
        const durationSeconds = window.__voiceOverForceExtendedDuration
          ? request.targetDurationSeconds + 3
          : Math.min(Math.max(request.targetDurationSeconds, 0.3), 2);
        // Capped at 4s (not 2s) so a forced-extended line can still be
        // genuinely playing once real playback reaches a *later* cue's own
        // boundary — the multi-cue Extended Audio Description sync test
        // needs the real audio to still be going at that point, not to
        // have already finished on its own.
        const audioUrl = await synthesizeSilentWav(Math.min(durationSeconds, 4));
        return { success: true, audioUrl, durationSeconds };
      }

      async cancelLine(request) {
        window.__voiceOverCancelCalls.push(request);
      }
    }

    const video = document.getElementById("video");
    const readyState = document.getElementById("ready-state");
    const errorMessage = document.getElementById("error-message");
    const selectedAudioTrackId = document.getElementById("selected-audio-track-id");
    const audioTrackList = document.getElementById("audio-track-list");
    const selectedSubtitleTrackId = document.getElementById("selected-subtitle-track-id");
    const subtitleCueText = document.getElementById("subtitle-cue-text");

    // Backs PlayerPreferenceStore with localStorage so a real page.reload()
    // in a test (a fresh JS context, exactly like relaunching an app) can
    // prove AudioTrackController's auto-restore-from-storage path, not just
    // its in-memory default-track fallback.
    class LocalStoragePreferenceStore {
      getAudioLanguage() {
        return localStorage.getItem("e2e-audio-language");
      }
      setAudioLanguage(language) {
        localStorage.setItem("e2e-audio-language", language);
      }
    }

    // setDelaySeconds() only ever affects cues that pass through
    // SubtitleController's own canonicalCues -> CueProjector -> renderer
    // pipeline. HlsNativeSubtitleSource never emits onCuesChanged (hls.js
    // paints its own subtitles directly onto a hidden TextTrack instead), so
    // delay is a permanent no-op for the fixture's embedded WebVTT track —
    // this static source exists purely to exercise the delay contract for
    // real, the way a VodExtractedSubtitleSource/OpenSubtitlesSource would.
    const STATIC_SUBTITLE_SOURCE_ID = asSubtitleSourceId("static-test");
    const STATIC_SUBTITLE_TRACK_ID = asSubtitleTrackId(9999);
    const STATIC_CUE = { startSeconds: 2, endSeconds: 3, text: "Delay test cue" };
    class StaticSubtitleSource {
      sourceId = STATIC_SUBTITLE_SOURCE_ID;
      #cueListeners = new Set();
      getTracks() {
        return [
          {
            trackId: STATIC_SUBTITLE_TRACK_ID,
            displayName: "Static",
            language: "en",
            kind: TrackKind.Default,
            sourceId: STATIC_SUBTITLE_SOURCE_ID,
          },
        ];
      }
      selectTrack(trackId) {
        if (trackId === STATIC_SUBTITLE_TRACK_ID) {
          this.#cueListeners.forEach((callback) => callback([STATIC_CUE]));
        }
      }
      onTracksChanged() {
        return () => {};
      }
      onCuesChanged(trackId, callback) {
        if (trackId !== STATIC_SUBTITLE_TRACK_ID) return () => {};
        this.#cueListeners.add(callback);
        return () => this.#cueListeners.delete(callback);
      }
      dispose() {}
    }

    function renderAudioTracks(player) {
      const tracks = player.audio.getTracks();
      const selectedId = player.audio.selectedTrackId;
      selectedAudioTrackId.textContent = selectedId === null ? "" : String(selectedId);
      audioTrackList.innerHTML = "";
      for (const track of tracks) {
        const li = document.createElement("li");
        const button = document.createElement("button");
        button.dataset.trackId = String(track.trackId);
        button.dataset.language = track.language ?? "";
        button.textContent = `${track.language ?? track.displayName} (${track.trackId})`;
        if (track.trackId === selectedId) button.classList.add("selected");
        button.addEventListener("click", () => player.audio.select(track.trackId));
        li.appendChild(button);
        audioTrackList.appendChild(li);
      }
    }

    // Rebuilds the adapter/player from scratch with the given HlsJsAdapter
    // options — needed for tests exercising shouldRetry/maxRetries, which
    // can only be configured at HlsJsAdapter construction time, not changed
    // on a live instance.
    function createPlayer(adapterOptions = {}) {
      window.__player?.destroy();

      // manifestLoadError (e.g. a 404) leaves hls.js with zero levels; the
      // adapter's default recovery (startLoad()) only resumes level loading,
      // so it no-ops on a manifest that never loaded at all — the adapter's
      // own docs call this out and expose reloadOnDetail as the documented
      // fix (a real hls.loadSource() reload instead), which is what lets a
      // permanently-unloadable URL actually exhaust maxRetries and surface a
      // fatal error instead of hanging forever.
      const adapter = new HlsJsAdapter({
        reloadOnDetail: ["manifestLoadError", "manifestParsingError"],
        ...adapterOptions,
      });
      // Appended LAST on purpose: getTracks() reports sources in registration
      // order, and existing tests index subtitleTracks[0] expecting the
      // hls-native track.
      //
      // Present so a test can exercise the real three-source shape a host app
      // runs (manifest-embedded + transcode-extracted + remote), and
      // specifically the re-selection round-trip: unlike the two above, this
      // source caches fetched cues, so re-selecting it after switching away
      // must re-emit them rather than silently render nothing.
      const vodExtractedSource = new VodExtractedSubtitleSource({
        sourceId: asSubtitleSourceId("vod-extracted"),
        tracks: [
          {
            trackId: asSubtitleTrackId(200000),
            displayName: "VOD extracted",
            language: "en",
            kind: TrackKind.Manual,
            vttUrl: "/fixtures/cues.vtt",
          },
        ],
      });

      const staticSubtitleSource = new StaticSubtitleSource();
      const subtitleSources = [
        new HlsNativeSubtitleSource({ sourceId: asSubtitleSourceId("hls-native"), adapter }),
        staticSubtitleSource,
        vodExtractedSource,
      ];

      window.__voiceOverShouldFail = false;
      window.__voiceOverForceExtendedDuration = false;
      window.__voiceOverCancelCalls = [];
      window.__voiceOverLineEvents = [];

      const player = new MediaPlayer({
        video,
        hlsAdapter: adapter,
        subtitleSources,
        preferenceStore: new LocalStoragePreferenceStore(),
        voiceOverGateway: new FakeVoiceOverGateway(),
      });

      readyState.textContent = "false";
      errorMessage.textContent = "";

      // errorObserved fires for every hls.js error (fatal or not) before any
      // retry policy runs — the only place a transient, successfully-retried
      // failure is ever visible, since a recovered error never reaches
      // MediaPlayer's own "error" event.
      window.__adapterErrors = [];
      adapter.on("errorObserved", (event) => window.__adapterErrors.push(event));

      player.audio.onTracksChanged(() => renderAudioTracks(player));
      player.audio.onSelectionChanged(() => renderAudioTracks(player));

      player.subtitles.onSelectionChanged((track) => {
        selectedSubtitleTrackId.textContent = track ? String(track.trackId) : "";
      });

      player.events.on("ready", () => {
        readyState.textContent = "true";
      });
      player.events.on("error", (event) => {
        errorMessage.textContent = `${event.code}|fatal:${event.fatal}`;
      });

      window.__player = player;
      window.__loadSource = (url) => player.loadSource(url);
      window.__selectSubtitleTrack = (trackId) => player.subtitles.selectTrack(trackId);
      window.__getSubtitleTracks = () => player.subtitles.getTracks();
      window.__setSubtitleDelay = (offsetSeconds) => player.subtitles.setDelaySeconds(offsetSeconds);
      // Exposed to prove destroy() is idempotent (a real consumer's cleanup
      // effect can plausibly run twice, e.g. React StrictMode double-invoke)
      // and doesn't throw the second time.
      window.__destroy = () => player.destroy();

      if (player.voiceOver) {
        window.__getVoiceOverTracks = () => player.voiceOver.getTracks();
        window.__selectVoiceOverTrack = (trackId) => player.voiceOver.selectTrack(trackId);
        // Piggybacks on the SAME StaticSubtitleSource instance already wired
        // into subtitleSources — its cue window (2s-3s) only starts flowing
        // once selectTrack() activates it, so the test must first select it
        // via __selectSubtitleTrack(9999) for visible subtitles, then bind
        // voice-over onto that already-active source (bindSubtitleSource
        // itself never calls selectTrack, by design).
        window.__bindVoiceOverToStaticSubtitleTrack = () =>
          player.voiceOver.bindSubtitleSource(staticSubtitleSource, STATIC_SUBTITLE_TRACK_ID);
        // Real multi-cue fixture (cues.vtt: 1s-3s, 3.5s-5.5s, 5.5s-7.5s) —
        // for tests that need a genuine NEXT cue to sync Extended Audio
        // Description's freeze against, unlike the single-cue static track.
        window.__bindVoiceOverToVodExtractedTrack = () =>
          player.voiceOver.bindSubtitleSource(vodExtractedSource, asSubtitleTrackId(200000));
        window.__unbindVoiceOverSubtitleTrack = () =>
          player.voiceOver.bindSubtitleSource(null, null);
        window.__setVoiceOverShouldFail = (shouldFail) => {
          window.__voiceOverShouldFail = shouldFail;
        };
        // Two independent volume levers for a settings-popover-style UI:
        // "original sound" (how loud the video itself plays while ducked)
        // and "voice-over sound" (the narration line's own volume) — neither
        // derives from or scales the other.
        window.__setVoiceOverDuckVolume = (volume) => player.voiceOver.setDuckVolume(volume);
        window.__setVoiceOverVolume = (volume) => player.voiceOver.setVoiceOverVolume(volume);
        // WCAG 1.2.7 Extended Audio Description: pauses the video instead
        // of ducking when a line's synthesized duration exceeds its cue's
        // own window.
        window.__setVoiceOverAllowVideoPause = (allow) => player.voiceOver.setAllowVideoPause(allow);
        window.__setVoiceOverForceExtendedDuration = (force) => {
          window.__voiceOverForceExtendedDuration = force;
        };

        player.voiceOver.onSelectionChanged((track) => {
          selectedVoiceOverTrackId.textContent = track ? track.trackId : "";
        });
        player.voiceOver.onGeneratingChanged((isGenerating) => {
          voiceOverIsGenerating.textContent = String(isGenerating);
        });
        player.events.on("voiceOverLineFailed", (event) => {
          logVoiceOverEvent({ type: "failed", trackId: event.trackId });
        });
        player.events.on("voiceOverPlaybackRejected", (event) => {
          logVoiceOverEvent({ type: "rejected", trackId: event.trackId });
        });
        setInterval(() => {
          voiceOverVideoVolume.textContent = String(video.volume);
        }, 50);
      }

      renderAudioTracks(player);
    }

    // Exposed so a test can reconfigure shouldRetry/maxRetries/retryDelayMs
    // — options only settable at construction — without reloading the page.
    window.__recreatePlayer = (adapterOptions) => createPlayer(adapterOptions);

    // hls.js renders HlsNativeSubtitleSource cues directly onto its own
    // hidden TextTrack (see HlsNativeSubtitleSource's class docs — it never
    // emits onCuesChanged), so the only reliable way to observe the
    // rendered cue text is to poll every native TextTrack's activeCues,
    // not go through the library's own SubtitleController state.
    setInterval(() => {
      let activeCueText = "";
      for (const track of video.textTracks) {
        if (!track.activeCues || track.activeCues.length === 0) continue;
        for (const cue of track.activeCues) {
          if (cue.text) activeCueText = cue.text;
        }
      }
      subtitleCueText.textContent = activeCueText;
    }, 100);

    createPlayer();
  </script>
</body>
</html>
