name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  # A release in flight must not be cancelled mid-publish.
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm Trusted Publishing (OIDC) — this repo is public, so no
  # long-lived NPM_TOKEN secret is needed. One-time manual setup required:
  # on npmjs.com, for both @electron-media/core and @electron-media/react,
  # set this repository + this workflow file as a Trusted Publisher.
  # Publish fails until that's done — it cannot be done from inside a workflow.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # npm OIDC trusted publishing landed in npm 11.5.0 (2025-07-24) — but
      # Node 22 bundles npm 10.9.x regardless of patch version (verified
      # against nodejs/node's deps/npm/package.json across every 22.15-22.20
      # tag), which predates that feature entirely. Without this, `npm
      # publish` silently falls back to classic token auth and fails with
      # ENEEDAUTH — even with a correctly configured npmjs.com Trusted
      # Publisher and id-token: write above — because the npm binary itself
      # has no OIDC exchange code to run.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      # packages/react's tests import @electron-media/core as a real
      # package (dist/index.js, per its "exports" field) rather than
      # aliasing to source — without a build first, a fresh checkout has
      # no dist/ yet and vite's resolver fails with "Failed to resolve
      # entry for package". ci.yml already builds before testing; this
      # job needs the same order.
      - run: pnpm build
      - run: pnpm test

      # If there are pending .changeset/*.md files, this opens/updates a
      # "Version Packages" PR instead of publishing. Publishing only
      # happens on a later run, once that PR is merged and no changesets
      # remain — see changesets/action's own docs for this two-step flow.
      - name: Create Version PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
