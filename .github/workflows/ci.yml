name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, typecheck, build, test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # LTS lines plus current, not the whole Node release history — this
        # repo is two small packages, not a project that needs a support
        # matrix as wide as Node's own release cadence.
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # NOT preinstalled on ubuntu-latest. e2e/generate-stream.mjs shells out
      # to it directly (execFileSync("ffmpeg", ...)) to build the fixture
      # HLS stream; without this step the suite fails at fixture generation,
      # before a single test runs.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # playwright.config.ts is chromium-only — installing the other two
      # engines here would just be wasted download time.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
